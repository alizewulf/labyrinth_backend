services:
  postgres:
    image: postgres:17
    container_name: labyrinth-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: labyrinth
      POSTGRES_USER: labyrinth
      POSTGRES_PASSWORD: labyrinth

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: